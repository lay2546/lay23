<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div id="loginContent">
    <!-- 🔐 ฟอร์มเข้าสู่ระบบ -->
    <div id="loginForm">
      <h2>เข้าสู่ระบบ</h2>
      <input id="login-username" type="email" placeholder="อีเมล" class="modal-input" />
      <input id="login-password" type="password" placeholder="รหัสผ่าน" class="modal-input" />
      <button id="submit-login" class="modal-button pink">เข้าสู่ระบบ</button>
      <p class="text-center">
        ยังไม่มีบัญชี?
        <a href="#" id="openRegister" class="modal-link">สมัครที่นี่</a>
      </p>
    </div>

    <!-- 📝 ฟอร์มสมัครสมาชิก -->
    <div id="registerForm" class="hidden">
      <h2>สมัครสมาชิก</h2>
      <input id="register-name" type="text" placeholder="ชื่อผู้ใช้" class="modal-input" />
      <input id="register-email" type="email" placeholder="อีเมล" class="modal-input" />
      <input id="register-password" type="password" placeholder="รหัสผ่าน" class="modal-input" />
      <button id="submit-register" class="modal-button green">สมัครสมาชิก</button>
      <p class="text-center">
        มีบัญชีอยู่แล้ว?
        <a href="#" id="backToLogin" class="modal-link">กลับเข้าสู่ระบบ</a>
      </p>
    </div>
  </div>
</body>
</html>
