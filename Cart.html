<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart - Le Poney</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="Cart.css" />
</head>
<body class="bg-gray-100">

  <!-- 🌟 แถบบน -->
  <header id="top-bar" class="top-bar">
    <h1 class="top-bar-title logo-text">Le Poney</h1>
    <div class="top-bar-buttons">
      <button id="menu-btn" class="menu-button">☰</button>
    </div>
  </header>

  <!-- 🌟 Overlay -->
  <div id="overlay" class="overlay hidden"></div>

  <!-- 🌟 Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button id="close-btn" class="close-button">&times;</button>
    </div>
    <nav class="sidebar-nav">
      <a href="Home.html" class="nav-link">🏡 Home</a>
      <div class="dropdown">
        <button class="dropdown-btn">🛍️ Product <span class="arrow">&#9662;</span></button>
        <div class="dropdown-content">
          <a href="Product.html" class="dropdown-link">🍰 Bakery & Dessert</a>
          <a href="Product2.html" class="dropdown-link">🥤 SMOOTHIE & OTHERS</a>
        </div>
      </div>
      <a href="Cart.html" id="cart-menu" class="nav-link">🛒 Cart <span id="cart-count">(0)</span></a>
      <a href="Delivery.html" class="nav-link">🚚 Delivery</a>
      <a href="Event.html" class="nav-link">📅 Event</a>
      <a href="#" class="nav-link" id="loginBtn">🔑 Login</a>
      <button id="logoutBtn" class="logout-button hidden">🚪 Logout</button>
    </nav>
  </aside>

  <!-- 🌟 ตะกร้าสินค้า -->
  <main class="cart-container">
    <h2 class="text-2xl font-bold text-center mb-6">รายการสินค้าในตะกร้า</h2>
    <ul id="cart-items" class="cart-list">
      <li class="empty-cart text-center">ไม่มีสินค้าในตะกร้า</li>
    </ul>
    <div class="cart-summary">
      <p class="total-items">📦 จำนวนทั้งหมด: <span id="total-items">0</span> ชิ้น</p>
      <p class="total-price">💰 ราคารวม: ฿<span id="total-price">0</span></p>
      <button id="clear-cart" class="clear-cart-button">🗑️ ล้างตะกร้า</button>
      <button id="checkout" class="checkout-button">✅ ดำเนินการสั่งซื้อ</button>
    </div>
  </main>

  <!-- 🔐 Modal Login -->
  <div id="loginModal" class="modal hidden">
    <div class="modal-content relative">
      <span class="close-modal" id="closeModal">&times;</span>
      <div id="loginContent">กำลังโหลด...</div>
    </div>
  </div>

  <!-- 🔧 Scripts -->
  <script src="script.js"></script>
</body>
</html>
